[project]
name = "homeassistant-nova-poshta"
requires-python = ">=3.14.2"
# Real version lives in manifest.json
dynamic = ["version"]
# Keep in step with manifest.json
dependencies = [
  "stringcase>=1.2.0",
  "translitua==1.3.2",
  "novaposhta-python-client==0.1.10",
]

[dependency-groups]
dev = [
  { include-group = "lint" },
  "pytest-homeassistant-custom-component==0.13.375",
]
lint = ["ruff==0.17.5"]

[tool.uv]
package = false

[tool.ruff]
# Must not exceed the Python of the minimum HA in hacs.json
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]
section-order = ["future", "standard-library", "third-party", "homeassistant", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
homeassistant = ["homeassistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
